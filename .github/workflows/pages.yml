name: Publicar projeto-inpi-cgdi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar o site ativo
        working-directory: projeto-inpi-cgdi
        run: npm run check

      - name: Preparar publicação pela allowlist
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix 'projeto-inpi-cgdi' run build -- --output ../_site
          test ! -e _site/quarentena
          test ! -e _site/ferramentas
          test ! -e _site/package.json

      - name: Atualizar cache a cada publicacao
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/stamp_pages.py \
            --site _site \
            --version "$GITHUB_SHA"

      - name: Preparar Google Analytics com consentimento
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cgdi_ga4_publish.py \
            --site _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
